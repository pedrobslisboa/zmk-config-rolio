name: Draw ZMK keymaps
on:
  push:
    paths:
      - "config/*.keymap"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/draw-keymap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install keymap-drawer
        run: pip install keymap-drawer

      - name: Generate SVG
        run: |
          mkdir -p keymap-drawer
          keymap -c keymap_drawer.config.yaml parse -z config/sofle.keymap > keymap-drawer/sofle.yaml
          keymap -c keymap_drawer.config.yaml draw keymap-drawer/sofle.yaml -l '{zmk_keyboard: corne}' > keymap-drawer/sofle.svg

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keymap-drawer/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate keymap SVG"
            git push
          fi
